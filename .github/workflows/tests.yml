name: Docker offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: everymd-ci
      EVERYMD_LIVE: "0"
      EVERYMD_REASONING_EFFORT: low
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker build cache
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the local image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: everymd:0.1.0
          cache-from: type=gha,scope=everymd-offline
          cache-to: type=gha,mode=max,scope=everymd-offline
      - name: Restore Docling model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/docling-model-cache
          key: ${{ runner.os }}-docling-${{ hashFiles('requirements.lock', 'requirements.txt') }}
      - name: Seed the Docker volume
        run: |
          mkdir -p "$RUNNER_TEMP/docling-model-cache"
          docker volume create everymd-ci_model-cache
          docker run --rm \
            -v everymd-ci_model-cache:/models \
            -v "$RUNNER_TEMP/docling-model-cache:/cache:ro" \
            --entrypoint sh everymd:0.1.0 -c 'cp -a /cache/. /models/'
      - name: Run offline tests without project secrets
        run: docker compose run --rm -e EVERYMD_LIVE=0 -e EVERYMD_REASONING_EFFORT=low app pytest
      - name: Save local models for the cache action
        if: always() && steps.build.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/docling-model-cache"
          docker run --rm \
            -v everymd-ci_model-cache:/models:ro \
            -v "$RUNNER_TEMP/docling-model-cache:/cache" \
            --entrypoint sh everymd:0.1.0 -c 'cp -a /models/. /cache/'
