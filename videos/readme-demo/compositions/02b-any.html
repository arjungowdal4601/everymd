<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #an-root {
          position: absolute;
          inset: 0;
          color: #eef3ef;
        }
        #an-grid {
          position: absolute;
          left: 110px;
          top: 250px;
          width: 1700px;
          height: 760px;
          display: grid;
          grid-template-columns: repeat(4, minmax(0, 1fr));
          grid-template-rows: repeat(2, minmax(0, 1fr));
          gap: 22px 30px;
        }
        .an-card {
          position: relative;
          background: #121815;
          border: 2px solid #26312c;
          border-radius: 16px;
          overflow: hidden;
          box-shadow: 0 18px 44px rgba(0, 0, 0, 0.4);
        }
        .an-thumb {
          position: relative;
          height: 196px;
          background: #ffffff;
          overflow: hidden;
          border-bottom: 2px solid #26312c;
        }
        .an-thumb img {
          display: block;
          width: 100%;
        }
        .an-mail,
        .an-book {
          padding: 16px 20px;
          color: #2b2f2d;
        }
        .an-mail .k {
          font-size: 15px;
          color: #5c6661;
        }
        .an-mail .s {
          font-family: "Montserrat", sans-serif;
          font-weight: 700;
          font-size: 19px;
          margin: 6px 0 8px;
          color: #1d2120;
        }
        .an-mail .b,
        .an-book .b {
          font-size: 15px;
          line-height: 1.45;
        }
        .an-book {
          font-family: "EB Garamond", serif;
          background: #fbf7ee;
          height: 100%;
        }
        .an-book .t {
          font-size: 24px;
          font-weight: 700;
          margin-bottom: 8px;
        }
        .an-book .b {
          font-size: 18px;
        }
        .an-body {
          padding: 14px 20px 0;
        }
        .an-name {
          display: flex;
          align-items: baseline;
          gap: 12px;
        }
        .an-fmt {
          font-family: "Montserrat", sans-serif;
          font-weight: 900;
          font-size: 34px;
          letter-spacing: -0.03em;
        }
        .an-ext {
          font-size: 20px;
          color: #9aa8a0;
        }
        .an-out {
          margin-top: 10px;
          font-size: 22px;
          color: #cfd8d2;
          white-space: nowrap;
        }
        .an-out b {
          color: #57d68d;
        }
        .an-fix {
          margin-top: 6px;
          font-size: 21px;
          line-height: 1.3;
          color: #57d68d;
          white-space: nowrap;
        }
        .an-fix.an-note {
          color: #9aa8a0;
        }
      </style>

      <div id="an-root" class="mono" data-composition-id="any" data-width="1920" data-height="1080">
        <div class="cap" id="an-cap">Any document <em>in.</em></div>
        <div id="an-grid">
          <div class="an-card">
            <div class="an-thumb"><img src="assets/docx-p1.png" alt="" /></div>
            <div class="an-body"><div class="an-name"><span class="an-fmt">Word</span><span class="an-ext">.docx</span></div><div class="an-out">→ proposal.md <b>✓</b></div><div class="an-fix">garbled bullets removed</div></div>
          </div>
          <div class="an-card">
            <div class="an-thumb"><img src="assets/pptx-p3.png" alt="" /></div>
            <div class="an-body"><div class="an-name"><span class="an-fmt">Slides</span><span class="an-ext">.pptx</span></div><div class="an-out">→ board_deck.md <b>✓</b></div><div class="an-fix">chart labels added</div></div>
          </div>
          <div class="an-card">
            <div class="an-thumb"><img src="assets/html-p1.png" alt="" /></div>
            <div class="an-body"><div class="an-name"><span class="an-fmt">Web</span><span class="an-ext">.html / URL</span></div><div class="an-out">→ page.md <b>✓</b></div><div class="an-fix">chart described</div></div>
          </div>
          <div class="an-card">
            <div class="an-thumb"><img src="assets/invoice.png" alt="" /></div>
            <div class="an-body"><div class="an-name"><span class="an-fmt">Image</span><span class="an-ext">.png</span></div><div class="an-out">→ invoice.md <b>✓</b></div><div class="an-fix">reading order fixed</div></div>
          </div>
          <div class="an-card">
            <div class="an-thumb"><img src="assets/pdf-p1.png" alt="" /></div>
            <div class="an-body"><div class="an-name"><span class="an-fmt">PDF</span><span class="an-ext">.pdf</span></div><div class="an-out">→ report.md <b>✓</b></div><div class="an-fix">formula cleaned up</div></div>
          </div>
          <div class="an-card">
            <div class="an-thumb"><img src="assets/scan-p1.png" alt="" /></div>
            <div class="an-body"><div class="an-name"><span class="an-fmt">Scan</span><span class="an-ext">.pdf</span></div><div class="an-out">→ scanned_report.md <b>✓</b></div><div class="an-fix">garbled formula corrected</div></div>
          </div>
          <div class="an-card an-muted">
            <div class="an-thumb"><div class="an-book"><div class="t">Chapter 1: Choosing a bed</div><div class="b">Pick a spot with six hours of sun and soil that drains within a day of rain.</div></div></div>
            <div class="an-body"><div class="an-name"><span class="an-fmt">E-book</span><span class="an-ext">.epub</span></div><div class="an-out">→ booklet.md <b>✓</b></div><div class="an-fix an-note">no page check · brief</div></div>
          </div>
          <div class="an-card an-muted">
            <div class="an-thumb"><div class="an-mail"><div class="k">From: Priya Nair</div><div class="s">Pilot update: 497 sensors online</div><div class="b">Hi all, Quick update on the water sensor pilot: 497 sensors are online, up from 425 last quarter.</div></div></div>
            <div class="an-body"><div class="an-name"><span class="an-fmt">Email</span><span class="an-ext">.eml</span></div><div class="an-out">→ update.md <b>✓</b></div><div class="an-fix an-note">no page check · brief</div></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#an-cap", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 0.08);

          // the inputs arrive as one beat
          gsap.utils.toArray("#an-grid .an-card").forEach((el, i) => {
            tl.fromTo(el, { opacity: 0, y: 50, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 0.18 + i * 0.05);
          });

          // each one becomes its Markdown file; green marks a change the AI made on that page
          gsap.utils.toArray("#an-grid .an-card").forEach((el, i) => {
            const at = 0.55 + i * 0.04;
            tl.fromTo(el.querySelector(".an-out"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, at);
            tl.fromTo(el.querySelector(".an-fix"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, at + 0.1);
            if (!el.classList.contains("an-muted")) {
              tl.fromTo(el, { borderColor: "#26312c" }, { borderColor: "#2f6b47", duration: 0.3, ease: "none" }, at);
            }
          });

          tl.to("#an-root", { opacity: 0, duration: 0.18, ease: "power2.in" }, 3.2);
          window.__timelines["any"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
