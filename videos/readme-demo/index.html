<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0f0d;
      }
      #hf-main {
        position: relative;
        width: 100%;
        height: 100%;
        background: #0b0f0d;
        overflow: hidden;
      }
      /* shared by every scene (sub-compositions are mounted into this document) */
      .cap {
        position: absolute;
        left: 110px;
        top: 92px;
        font-family: "Montserrat", sans-serif;
        font-weight: 900;
        font-size: 96px;
        line-height: 1;
        letter-spacing: -0.04em;
        white-space: nowrap;
        color: #eef3ef;
      }
      .cap em {
        font-style: normal;
        color: #57d68d;
      }
      .cap .bad {
        color: #ff6b5b;
      }
      .mono {
        font-family: "JetBrains Mono", monospace;
        font-variant-ligatures: none;
        font-feature-settings: "liga" 0, "calt" 0;
      }
      .card {
        position: absolute;
        background: #121815;
        border: 2px solid #26312c;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }
      .card-head {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        height: 70px;
        border-bottom: 2px solid #1f2924;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 26px;
        font-size: 25px;
        color: #cfd8d2;
      }
      .tick {
        position: absolute;
        border-radius: 50%;
        background: #57d68d;
        color: #0b0f0d;
        display: grid;
        place-items: center;
      }
      .tick svg {
        width: 72%;
        height: 72%;
        fill: none;
        stroke: currentColor;
        stroke-width: 7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .mark {
        position: absolute;
        pointer-events: none;
      }
      .mark svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .mark path {
        fill: none;
        stroke: #ff6b5b;
        stroke-width: 4;
        stroke-linecap: round;
      }
    </style>
  </head>
  <body>
    <div
      id="hf-main"
      data-composition-id="main"
      data-start="0"
      data-duration="30.4"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="bg"
        data-composition-id="bg"
        data-composition-src="compositions/00-bg.html"
        data-start="0"
        data-duration="30.4"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/01-hook.html"
        data-start="0"
        data-duration="3"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="fix"
        data-composition-id="fix"
        data-composition-src="compositions/02-fix.html"
        data-start="3"
        data-duration="11"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="any"
        data-composition-id="any"
        data-composition-src="compositions/02b-any.html"
        data-start="14"
        data-duration="3.4"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="kept"
        data-composition-id="kept"
        data-composition-src="compositions/03-kept.html"
        data-start="17.4"
        data-duration="3"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="memory"
        data-composition-id="memory"
        data-composition-src="compositions/04-memory.html"
        data-start="20.4"
        data-duration="4.6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="long"
        data-composition-id="long"
        data-composition-src="compositions/05-long.html"
        data-start="25"
        data-duration="2.4"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="end"
        data-composition-id="end"
        data-composition-src="compositions/06-end.html"
        data-start="27.4"
        data-duration="3"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
