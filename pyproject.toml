[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "everymd"
version = "0.1.0"
description = "Turn documents into page-aware Markdown with Docling and an optional Deep Agents copy-editor."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
authors = [{name = "Arjun Gowda L"}]
dependencies = [
  "docling==2.132.0",
  "docling-parse==7.22.1",
  "rapidocr==3.9.2",
  "deepagents==0.7.21",
  "langchain==1.4.3",
  "langchain-core==1.6.6",
  "langchain-openai==1.6.7",
  "langchain-anthropic==1.7.5",
  "langchain-google-genai==4.4.0",
  "magika==1.0.3",
  "playwright==1.63.0",
  "python-dotenv==1.2.4",
  "python-pptx==1.0.2",
  "pypdfium2==5.13.0",
  "numpy==2.5.2",
  "pillow==12.3.0",
  "ocrmac==1.0.1; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "PyYAML==6.0.3",
  "openpyxl==3.1.5",
  "reportlab==5.0.1",
  "python-docx==1.2.0",
  "nbclient==0.11.0",
  "nbformat==5.11.1",
  "ipykernel==7.4.0",
  "jupyterlab==4.6.4",
]

[project.scripts]
everymd = "everymd.__main__:main"

[project.urls]
Repository = "https://github.com/arjungowdal4601/everymd"
Issues = "https://github.com/arjungowdal4601/everymd/issues"

[tool.setuptools.packages.find]
include = ["everymd*"]
exclude = ["tests*", "samples*", "eval*"]
